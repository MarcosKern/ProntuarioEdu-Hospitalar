# Acrescentar depois de compose.yaml e, quando usado, compose.mysql.yaml.
services:
  backend:
    environment:
      OIDC_ISSUER: ${AUTH_PUBLIC_URL:?Inicie scripts/auth_dev.py up}/realms/prontuarioedu
      OIDC_AUDIENCE: prontuario-api
      OIDC_JWKS_URL: https://keycloak:8443/realms/prontuarioedu/protocol/openid-connect/certs
      OIDC_AUTHORIZATION_URL: ${AUTH_PUBLIC_URL:?Inicie scripts/auth_dev.py up}/realms/prontuarioedu/protocol/openid-connect/auth
      OIDC_TOKEN_URL: ${AUTH_PUBLIC_URL:?Inicie scripts/auth_dev.py up}/realms/prontuarioedu/protocol/openid-connect/token
      OIDC_SSL_CA: /run/prontuario-auth/ca-bundle.crt
      SWAGGER_CLIENT_ID: prontuario-swagger
      # O provedor está nesta rede Docker; preservar exceções existentes e evitar o proxy externo.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},keycloak
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},keycloak
    volumes:
      - ${AUTH_STATE_DIR:?Execute scripts/auth_dev.py setup}/certs/ca-bundle.crt:/run/prontuario-auth/ca-bundle.crt:ro
    networks: [default, identity_provider]
networks:
  identity_provider:
    external: true
    name: ${AUTH_NETWORK_NAME:-prontuario-auth}
