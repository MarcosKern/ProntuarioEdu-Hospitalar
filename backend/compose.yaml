services:
  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: prontuario-backend-dev
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL para o MySQL externo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./scripts/create_admin.py:/app/scripts/create_admin.py:ro
    command: sh -c 'python -m alembic upgrade head && python -m uvicorn prontuario_backend.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log --no-proxy-headers'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
