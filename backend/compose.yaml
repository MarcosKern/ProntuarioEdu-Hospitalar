services:
  backend:
    image: prontuario-backend-dev
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/development.db
    volumes:
      - ./src:/app/src:ro
      - development-data:/app/data
    command: python -m uvicorn prontuario_backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  development-data:
