name: Backend validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prontuario
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: prontuario_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U prontuario -d prontuario_test' --health-interval 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://prontuario:ci-only-ephemeral@localhost:5432/prontuario_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prontuario-backend:ci backend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prontuario-backend:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
