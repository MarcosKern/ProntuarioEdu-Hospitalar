name: Backend validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: prontuario
          MYSQL_PASSWORD: ci-only-ephemeral
          MYSQL_ROOT_PASSWORD: ci-root-only-ephemeral
          MYSQL_DATABASE: prontuario_test
          MYSQL_ROOT_HOST: "%"
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-start-period=30s
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_TEST_URL: mysql+pymysql://root:ci-root-only-ephemeral@127.0.0.1:3306/prontuario_test
      MYSQL_TEST_ALLOW_RESET: prontuario_test
      # Application bootstrap URL is never used for test SQL.
      DATABASE_URL: mysql+pymysql://unused@127.0.0.1:3306/prontuario_application_not_used
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pip_audit -r requirements-dev.txt
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t prontuario-backend:ci backend
      - name: Scan image vulnerabilities and secrets
        # Official Trivy 0.65.0 image, pinned to the verified registry digest.
        # No runner-side download/install script is required.
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --image-src docker \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m \
            prontuario-backend:ci
